substitutions:
  _REGION: asia-southeast2
  _REPOSITORY: katalog-images
  _IMAGE_NAME: nextjs-app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud compute ssh "${_VM_NAME}" \
          --zone="${_VM_ZONE}" \
          --tunnel-through-iap \
          --quiet \
          --command="gcloud auth configure-docker ${_REGION}-docker.pkg.dev --quiet && cd '${_VM_APP_DIR}' && NEXTJS_IMAGE='${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA' docker compose pull nextjs && NEXTJS_IMAGE='${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA' docker compose up -d nextjs"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
