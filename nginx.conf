server {
    listen 80;
    server_name _;

    location = / {
        return 302 /portal;
    }

    # Jalur kanonik antarmuka admin GeoServer. Jangan menambahkan redirect dari
    # /portal ke /portal/ di sini, karena Next.js memakai trailingSlash dan
    # redirect dari dua sisi itu yang pernah menghasilkan ERR_TOO_MANY_REDIRECTS.
    location = /geoserver {
        return 302 /geoserver/web/;
    }

    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;

        # Host dikirim memakai $http_host supaya GeoServer tahu port publik yang
        # dipakai, bukan 8080 milik container di belakang proxy.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
